[package]
name = "ferro-sentry"
version = "0.2.7"
edition = "2021"
license = "Apache-2.0"
description = "SecuryBlack server security agent (EDR + posture)"
repository = "https://github.com/securyblack/ferro-sentry"

[dependencies]
sb-agent-core = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
dirs = "5"
async-trait = "0.1"
hostname = "0.4"
sha2 = "0.10"

tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3
lto = true
strip = true

# TEMPORAL: mismo motivo que en nexus-agent/Cargo.toml — el intake de
# comandos (`command_intake`) solo está en GitHub todavía (commit 8a342a9),
# sin publicar a crates.io. Quitar en cuanto se publique una versión del
# crate que lo incluya.
[patch.crates-io]
sb-agent-core = { git = "https://github.com/SecuryBlack/sb-agent-core.git", rev = "8730183" }

